name: weather_app
description: "A professional Weather App using Clean Architecture and Bloc."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # --- Localization ---
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # --- State Management & Architecture ---
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  get_it: ^7.6.0
  fpdart: ^1.1.0

  # --- Networking & Data ---
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  flutter_dotenv: ^5.1.0
  internet_connection_checker: ^1.0.0+1

  # --- UI & Design ---
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_screenutil: ^5.9.0
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  
  # هذا السطر ضروري جداً لتوليد ملفات الترجمة تلقائياً
  generate: true 

  assets:
    - .env
